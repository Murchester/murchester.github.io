name: Deploy Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A fresh checkout makes every file look brand new, so the footer
      # date would always be the deploy day. Put the real dates back.
      - name: Restore file dates
        run: |
          git ls-files -z content | while IFS= read -r -d '' f; do
            touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
          done

      - run: npm ci

      - name: Build homepage
        shell: bash
        env:
          SITE_URL: https://murchester.github.io
        run: |
          npm run build 2>&1 | tee build.log
          if grep -qE '^Broken |math error' build.log; then
            echo '::error::Broken link or math error, see the log above'
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
